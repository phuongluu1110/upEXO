<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap2me · EXO The Memories We Made</title>
<style>
:root{--rose:#c4687a;--deep:#9e3148;--soft:#f7e6e8;--ink:#3d2e28;--mut:#7a6258;--bg:#faf5ef;--line:#e6d8c8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.5rem;color:var(--deep);margin:.2em 0 .1em}.sub{color:var(--mut);margin:0 0 18px}
section,details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
h2{font-size:1.05rem;margin:0 0 10px;color:var(--deep)}summary{cursor:pointer;font-weight:600}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=password],input[type=date],textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--rose)}
textarea{min-height:70px;resize:vertical}input[type=file]{width:100%;font-size:.9rem}
.row{display:flex;gap:10px}.row>*{flex:1}
.slot{padding:10px 0;border-top:1px dashed var(--line)}
small{color:var(--mut);display:block;margin-top:3px}
button{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:10px 18px;background:var(--soft);color:var(--deep);font-weight:600}
button.main{background:var(--rose);color:#fff;width:100%;padding:14px;font-size:1.05rem;margin-top:6px}
button:disabled{opacity:.5;cursor:wait}
.ok{color:#2e7d4f}.err{color:#b3261e}
#log{white-space:pre-wrap;font:13px/1.6 ui-monospace,Menlo,monospace;background:#2b211d;color:#f1e6dc;border-radius:12px;padding:12px;display:none}
#result{display:none;text-align:center}#result a{word-break:break-all;color:var(--deep);font-weight:600}
#qr{display:flex;justify-content:center;margin:12px 0}
</style>
</head>
<body>
<main>
<h1>✦ Tap2me · EXO The Memories We Made</h1>
<p class="sub">Điền thông tin khách → bấm Tạo → nhận link để ghi vào chip NFC.</p>

<details id="settings">
  <summary>⚙ Kết nối GitHub (làm một lần)</summary>
  <label>Token GitHub (giữ kín, chỉ lưu trong trình duyệt này; cần quyền Contents: Read and write cho TẤT CẢ repo template)</label>
  <input type="password" id="s_token" autocomplete="off" placeholder="github_pat_...">
  <div class="row">
    <div><label>Tên tài khoản / tổ chức</label><input type="text" id="s_owner"></div>
    <div><label>Nhánh</label><input type="text" id="s_branch"></div>
  </div>
  <p><button type="button" id="saveCfg">Lưu cài đặt</button> <span id="cfgMsg"></span></p>
</details>

<section style="display:none">
  <h2>0. Chọn mẫu</h2>
  <select id="tpl"></select>
  <label>Tên repo GitHub của mẫu này</label>
  <input type="text" id="repo">
  <small>Mỗi mẫu một repo; tên repo được nhớ riêng cho từng mẫu.</small>
</section>

<form id="f">
  <section>
    <h2>1. Link của khách</h2>
    <label>Tên thư mục (chữ thường, không dấu, ví dụ: anhiumodi)</label>
    <div class="row"><input type="text" id="slug" autocomplete="off" placeholder="tenkhach"><button type="button" id="rand" style="flex:0 0 auto">+ mã ngẫu nhiên</button></div>
    <small id="slugHint"></small>
    <p style="margin:10px 0 0"><button type="button" id="check">Kiểm tra / tải đơn cũ để sửa</button> <span id="checkMsg"></span></p>
  </section>

  <section id="boxText"></section>
  <section id="boxImg"></section>

  <section id="boxMedia">
    <h2>4. Video & nhạc</h2>
    <div id="boxVideo">
      <label>Video (không bắt buộc, nên dưới 25MB)</label>
      <input type="file" id="video" accept="video/*"><small id="s_video"></small>
    </div>
    <label>Nhạc nền</label>
    <select id="musicSel"></select>
    <div id="musicUp" style="display:none">
      <label>File nhạc (.mp3, dưới 15MB)</label><input type="file" id="musicFile" accept="audio/*">
      <label>Tên bài hát hiển thị</label><input type="text" id="musicName">
    </div>
    <div id="musicLink" style="display:none"><label>Link bài hát (YouTube hoặc Spotify)</label><input type="text" id="musicUrl" placeholder="https://..."></div>
  </section>

  <button class="main" id="go" type="submit">Tạo trang ✨</button>
</form>

<section id="result" style="margin-top:14px">
  <h2>Xong rồi!</h2>
  <p id="resStatus"></p>
  <a id="resLink" target="_blank" rel="noopener"></a>
  <div id="qr"></div>
  <button type="button" id="copy">Sao chép link</button>
</section>
<pre id="log"></pre>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" async></script>
<script>
// hiện lỗi của trang (nếu có) vào khung đen cuối trang
window.addEventListener("error", e => { const l=document.getElementById("log"); if(l){ l.style.display="block"; l.textContent += "✗ Lỗi trang: "+e.message+"\n"; } });

/* ================= CẤU HÌNH TỪNG TEMPLATE =================
   text: [id, nhãn, giá trị mặc định, số dòng (nếu là ô nhiều dòng)]
   img : [khóa, nhãn, cạnh dài tối đa (px), bắt buộc(1/0), có chú thích(1/0)]
   music: def = tên lựa chọn "giữ nhạc mặc định của template"; lib = nhạc có sẵn trong repo; none = cho phép không nhạc
   render(html, v, p, m): sửa trực tiếp file index.html của template cho từng khách
        v = chữ, p = tên file ảnh, m = {nhac, ten}; ô để trống = giữ chữ mẫu
   Muốn thêm template mới: thêm một khối vào T, không cần sửa chỗ khác. */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nl  = s => esc(s).replace(/\n/g, "<br>");
const el  = (attr, tag) => new RegExp("(" + attr + "[^>]*>)[\\s\\S]*?(</" + tag + ">)");
const inner = (h, re, t) => t ? h.replace(re, (m, a, b) => a + t + b) : h;
const rp  = (h, from, to) => to ? h.replace(from, () => to) : h;
const mp  = n => /^\.\.\//.test(n) ? n : "@@" + n;                      // @@ = file nằm trong thư mục khách
const setAudio = (h, re, m) => m.nhac ? h.replace(re, (a, b) => b + mp(m.nhac)) : h;
const paras = s => s.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean).map(x => "<p>" + nl(x) + "</p>").join("\n");
const cycle = (p, keys) => { const A = keys.map(k => p[k]).filter(Boolean); return keys.map((k, i) => A[i % A.length]); };

const EXO_POLA = [["2012","Lần đầu gặp nhau"],["2013","Bài hát nghe mãi"],["2016","Đêm concert đầu tiên"],["2018","Cả nhóm bên nhau"],["2020","Những ngày chờ đợi"],["2022","Mỗi người một đường"],["2024","Vẫn còn đó"],["2026","Và bây giờ"]];
const EXO_ROAD = [["2012","Chúng mình gặp các anh khi còn rất trẻ. Một bài hát, một sân khấu, và mọi thứ bắt đầu."],["2016","Ta nhìn các anh lớn lên, đổi thay, đứng trên những sân khấu ngày một rộng hơn. Ta cũng đang lớn lên, theo cách của riêng mình."],["2020","Có những ngày vui, cũng có những lúc khó khăn, có những lần chờ đợi thật dài. Nhưng ta vẫn ở đây, vẫn nghe, vẫn nhớ."],["2026","Những bài hát nghe đi nghe lại, những sân khấu đã chờ… vẫn còn nguyên ý nghĩa. Một phần tuổi trẻ của ta đã lớn lên cùng nhau."]];
const EXO_NOTES = [["Time","Thời gian dần trôi. Mỗi người chọn cho mình một hướng đi. Có những thay đổi, có những khó khăn, và mỗi lần chờ đợi lại dài hơn ta nghĩ."],["Change","Những cái tên từng dành cả tuổi trẻ để theo đuổi ngày ấy chỉ còn là một phần nhỏ của cuộc sống, khi tất cả cùng lớn thêm một chút. Có thể con đường không còn như xưa. Có thể năm tháng đã bào mòn ta theo những cách ta chưa từng nghĩ tới."],["Hope","Nhưng có lẽ trưởng thành là hiểu rằng, có những điều không cần giữ nguyên vẹn để vẫn còn ý nghĩa."]];

const T = {
exo: {
  name: "EXO – The Memories We Made", repo: "temp-exo", video: true,
  reserved: ["images", "audio", "videos", "khach"],
  music: { def: "Giữ bài mặc định của template", lib: [], links: true },
  text: [
    ["gate","Màn hình mở đầu – câu mở đầu","Chúng ta đã cùng nhau lớn lên."],
    ["kicker","Dòng nhỏ phía trên ảnh","EXO · EXO-L · 2012 — 2026"],
    ["t1","Tiêu đề, dòng 1","Chúng ta đã lớn"],
    ["t2","Tiêu đề, dòng 2 (in nghiêng)","lên cùng nhau."],
    ["hsub","Câu giới thiệu","Năm tháng trôi qua. Ta đã đổi thay. Họ cũng vậy.\nVà không hiểu sao, những tấm ảnh này vẫn nhớ ta từng là ai.",3],
    ["ycap","Our Youth – chú thích video","2012 — 2026"],
    ["youthK","Our Youth – câu mở","We had a youth together."],
    ["youthText","Our Youth – lời nhắn (trống một dòng giữa các đoạn)","Có thể khi ấy ta chưa biết, nhưng những năm tháng đó chính là tuổi trẻ của mình.\n\nTa có những bài hát để chờ, những sân khấu để mong, những cái tên khiến ngày trôi qua nhẹ nhàng hơn một chút.\n\nCó một Neverland nhỏ trong lòng, nơi tuổi trẻ vẫn chưa chịu rời đi.\n\nNhiều năm nữa, có thể ta chẳng nhớ hết từng chi tiết. Nhưng ta vẫn sẽ nhớ cảm giác được trẻ, được yêu một điều gì đó bằng cả trái tim, và có những người mà âm nhạc của họ đã trở thành một phần cuộc sống.",8],
    ...EXO_NOTES.flatMap(([k, t], i) => [["n"+(i+1)+"k", "Onward – ghi chú "+(i+1)+": tiêu đề", k], ["n"+(i+1)+"t", "Onward – ghi chú "+(i+1)+": nội dung", t, 3]]),
    ["closing","Onward – câu kết","Chúng mình vẫn ở đây.\nCác anh vẫn đang bước tiếp.\nVà biết đâu, vẫn còn vài ký ức nữa\nđang chờ ta phía trước.",4],
    ["date","Lá thư – ngày","Một đêm cuối năm, 2026"],
    ["to","Lá thư – lời gọi đầu thư","Gửi EXO,"],
    ["loiNhan","Lá thư – nội dung (trống một dòng giữa các đoạn, xuống dòng thường để ngắt dòng trong đoạn)","Cảm ơn các anh đã là một phần tuổi trẻ của em.\nCảm ơn những bài hát, những sân khấu, những khoảnh khắc đã lặng lẽ trở thành một phần câu chuyện của em.\n\nMình đã đi được một chặng đường dài.\nDù thời gian có trôi bao lâu, em nghĩ một phần trong em sẽ luôn nhớ đứa trẻ ngày ấy, vô tình tìm thấy các anh trên màn hình TV.\n\nNếu những năm tháng ấy là một chương của tuổi trẻ,\nthì em biết ơn vì EXO đã được viết ở đâu đó trong đó.\n\nHy vọng trong tương lai em sẽ gặp được điều em muốn, mà anh vẫn còn giữ được ước nguyện thuở ấy.",10],
    ["sign","Lá thư – ký tên","— Wendy"],
    ["fsub","Câu cuối trang","And maybe, there are still a few memories left to make."],
    ["ffoot","Dòng chân trang","EXO × EXO-L · 2026"],
  ],
  // mỗi ảnh có ô Năm + Chú thích riêng; ảnh nào không chọn thì giữ ảnh mẫu của template
  img: [
    ...EXO_POLA.map(([y, c], i) => ["a"+(i+1), "Ảnh polaroid "+(i+1)+(i<4?" (hàng trên)":" (hàng dưới)"), 1100, 0, [["y","Năm",y], ["t","Chú thích",c]]]),
    ...EXO_ROAD.map(([y, t], i) => ["h"+(i+1), "Ảnh khung “The road we’ve shared” "+(i+1), 1100, 0, [["y","Năm",y], ["t","Lời khi rê chuột / chạm",t,3]]]),
  ],
  render: (h, v, p, m) => {
    [1,2,3,4,5,6,7,8].forEach(i => { if (p["a"+i]) h = h.replace('src="images/anh-' + i + '.jpg"', 'src="@@' + p["a"+i] + '"'); });
    [1,2,3,4].forEach(i => { if (p["h"+i]) h = h.replace('src="images/hanh-trinh-' + i + '.jpg"', 'src="@@' + p["h"+i] + '"'); });
    if (m.video) h = h.replace('src="videos/tuoi-tre.mp4"', 'src="@@' + m.video + '"');
    h = inner(h, el('class="gate-line"','p'), esc(v.gate));
    h = inner(h, el('class="hero-kicker"','p'), esc(v.kicker));
    h = inner(h, el('class="hero-title"','h2'), (v.t1 || v.t2) ? esc(v.t1) + "<br><em>" + esc(v.t2) + "</em>" : "");
    h = inner(h, el('class="hero-sub"','p'), nl(v.hsub));
    h = rp(h, "<figcaption>2012 — 2026</figcaption>", v.ycap && "<figcaption>" + esc(v.ycap) + "</figcaption>");
    // 12 chú thích theo thứ tự trong trang: 8 polaroid đầu trang, rồi 4 khung Journey
    let n = 0;
    h = h.replace(/<figcaption><b>([^<]*)<\/b>([^<]*)<\/figcaption>/g, (a, y, d) => {
      n++; const k = n <= 8 ? "a" + n : "h" + (n - 8), yy = v["c_" + k + "_y"], tt = v["c_" + k + "_t"];
      return "<figcaption><b>" + (yy ? esc(yy) : y) + "</b>" + (n <= 8 ? (tt ? esc(tt) : d) : d) + "</figcaption>";
    });
    let j = 0; h = h.replace(/(<div class="memo-text"><p>)[^<]*(<\/p>)/g, (a, b, c) => { const t = v["c_h" + (++j) + "_t"]; return t ? b + nl(t) + c : a; });
    h = inner(h, el('class="y-k"','p'), esc(v.youthK));
    if (v.youthText) h = h.replace(/(<p class="y-k">[^<]*<\/p>)[\s\S]*?(<\/div>\s*<\/div>\s*<\/section>)/, (a, b, c) => b + "\n" + paras(v.youthText) + "\n        " + c);
    let q = 0; h = h.replace(/(<span class="note-k">)([^<]*)(<\/span>\s*<p>)([^<]*)(<\/p>)/g, (a, b, k, c, t, d) => { q++; return b + (v["n"+q+"k"] ? esc(v["n"+q+"k"]) : k) + c + (v["n"+q+"t"] ? nl(v["n"+q+"t"]) : t) + d; });
    h = inner(h, el('class="closing"','p'), nl(v.closing));
    h = inner(h, el('class="date"','p'), esc(v.date));
    h = inner(h, el('class="to"','p'), esc(v.to));
    h = inner(h, el('class="sign"','p'), esc(v.sign));
    if (v.loiNhan) h = h.replace(/(<p class="to">[\s\S]*?<\/p>)[\s\S]*?(<p class="sign">)/, (a, b, c) => b + "\n" + paras(v.loiNhan) + "\n" + c);
    h = inner(h, el('class="final-sub"','p'), esc(v.fsub));
    h = inner(h, el('class="final-foot"','p'), esc(v.ffoot));
    return h.replace('<script src="script.js"><\/script>', '<script src="@@script.js"><\/script>');
  },
  // nhạc nằm trong khối CONFIG của script.js nên mỗi khách có một bản script.js riêng
  extra: async (v, m) => {
    let s = await gh(`/contents/script.js?ref=${encodeURIComponent(C.branch)}`, {raw:true});
    const i = s.indexOf("const CONFIG"), e = s.indexOf("};", i) + 2;
    if (i < 0 || e < 2) throw new Error("Không tìm thấy khối CONFIG trong script.js của template.");
    let c = s.slice(i, e);
    const set = (k, val) => { const re = new RegExp("(" + k + ":\\s*)\"[^\"]*\""); if (!re.test(c)) throw new Error("Không tìm thấy “" + k + "” trong script.js của template."); c = c.replace(re, (a, b) => b + JSON.stringify(val)); };
    if (m.kind) { set("loai", m.kind); set("url", m.url); }
    else if (m.nhac) { set("loai", "mp3"); set("url", m.nhac); }
    else c = c.replace(/(url:\s*)"(?!https?:|\.\.\/)([^"]*)"/, (a, b, x) => b + '"../' + x + '"');   // nhạc mặc định nằm ở thư mục cha
    if (m.ten) set("tenBai", m.ten);
    return [{ path: "script.js", text: s.slice(0, i) + c + s.slice(e) }];
  },
},
};

/* ================= TIỆN ÍCH ================= */
const $ = id => document.getElementById(id);
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
let C = { token:"", owner:"phuongluu1110", branch:"main", repos:{}, ...(()=>{ try{ return JSON.parse(store.get("tap2me_cfg_exo")||"{}"); }catch(e){ return {}; } })() };
const rnd = n => Array.from({length:n},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*31)]).join("");
const slugify = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"d").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
const log = m => { const l=$("log"); l.style.display="block"; l.textContent += m+"\n"; l.scrollTop=l.scrollHeight; };
const b64 = blob => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); });
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
let tk = "exo", existing = null, loadedSlug = null, exP = {};
const TP = () => T[tk];
const repo = () => (C.repos[tk] || TP().repo);
const siteBase = () => `https://${C.owner}.github.io/${repo()}/`;

async function gh(path, {method="GET", body, raw}={}) {
  const r = await fetch(`https://api.github.com/repos/${C.owner}/${repo()}${path}`, {
    method,
    headers: { Authorization:"Bearer "+C.token, Accept: raw?"application/vnd.github.raw+json":"application/vnd.github+json", ...(body?{"Content-Type":"application/json"}:{}) },
    body: body?JSON.stringify(body):undefined });
  if (!r.ok) { const e=new Error("HTTP "+r.status); e.status=r.status; try{ e.detail=(await r.json()).message; }catch(_){} throw e; }
  return raw ? r.text() : r.json();
}
const explain = e => e.status===401 ? "Token sai hoặc hết hạn."
  : (e.status===403||e.status===404) ? "Token chưa đủ quyền (cần Contents: Read and write cho repo “"+repo()+"”) hoặc sai tên tài khoản/repo/nhánh."
  : (e.message+(e.detail?" – "+e.detail:""));

/* ================= CÀI ĐẶT & CHỌN TEMPLATE ================= */
["token","owner","branch"].forEach(k => $("s_"+k).value = C[k]||"");
if (!C.token) $("settings").open = true;
$("saveCfg").onclick = () => { ["token","owner","branch"].forEach(k => C[k] = $("s_"+k).value.trim());
  store.set("tap2me_cfg_exo", JSON.stringify(C)); $("cfgMsg").textContent="Đã lưu ✓"; $("cfgMsg").className="ok"; hint(); };

Object.entries(T).forEach(([k,t]) => { const o=document.createElement("option"); o.value=k; o.textContent=t.name; $("tpl").appendChild(o); });
$("tpl").onchange = () => { tk=$("tpl").value; existing=null; loadedSlug=null; exP={}; $("repo").value=repo(); $("checkMsg").textContent=""; buildForm(); hint(); };
$("repo").oninput = () => { C.repos[tk]=$("repo").value.trim(); store.set("tap2me_cfg_exo", JSON.stringify(C)); hint(); };

function buildForm() {
  const t = TP();
  $("boxText").innerHTML = '<h2>2. Chữ trên trang</h2>' + (tk==="relationship" ? "" : "<small>Ô để trống = giữ chữ mẫu của template.</small>");
  t.text.forEach(([id,lb,df,rows,type]) => { const d=document.createElement("div");
    d.innerHTML = `<label>${lb}</label>` + (rows ? `<textarea id="v_${id}" rows="${rows}"></textarea>` : `<input type="${type||"text"}" id="v_${id}">`);
    $("boxText").appendChild(d); $("v_"+id).value = df||""; });
  $("boxImg").innerHTML = "<h2>3. Ảnh</h2>";
  t.img.forEach(([k,lb,max,req,cap]) => { const d=document.createElement("div"); d.className="slot";
    d.innerHTML = `<label>${lb}${req?" *":""}</label><input type="file" id="f_${k}" accept="image/*">` +
      `<img id="p_${k}" alt="" style="display:none;max-width:150px;max-height:110px;border-radius:8px;margin-top:6px">` +
      (Array.isArray(cap)
        ? cap.map(([id,l,df,rows]) => `<label>${l}</label>` + (rows ? `<textarea id="c_${k}_${id}" rows="${rows}"></textarea>` : `<input type="text" id="c_${k}_${id}">`)).join("")
        : cap ? `<input type="text" id="c_${k}" placeholder="${typeof cap === "string" ? cap : "Chú thích dưới ảnh (không bắt buộc)"}" style="margin-top:6px">` : "") + `<small id="s_${k}"></small>`;
    $("boxImg").appendChild(d);
    if (Array.isArray(cap)) cap.forEach(([id,,df]) => $("c_"+k+"_"+id).value = df||"");
    $("f_"+k).onchange = e => { const f=e.target.files[0], im=$("p_"+k); if (f) { im.src=URL.createObjectURL(f); im.style.display="block"; } else im.style.display="none"; }; });
  $("boxVideo").style.display = t.video ? "" : "none"; $("s_video").textContent = "";
  const ms=$("musicSel"); ms.innerHTML=""; const add=(v,x)=>{ const o=document.createElement("option"); o.value=v; o.textContent=x; ms.appendChild(o); };
  if (t.music.def) add("def", t.music.def);
  t.music.lib.forEach((m,i) => add("lib"+i, m.name));
  if (t.music.none) add("none","Không dùng nhạc");
  if (t.music.links) { add("yt","Dán link YouTube"); add("sp","Dán link Spotify"); }
  add("up","Tải nhạc khác lên...");
  ms.onchange = () => { $("musicUp").style.display = ms.value==="up" ? "block":"none"; $("musicLink").style.display = (ms.value==="yt"||ms.value==="sp") ? "block":"none"; }; ms.onchange();
}

/* ================= SLUG & TẢI ĐƠN CŨ ================= */
const curSlug = () => slugify($("slug").value);
function hint(){ const s=curSlug(); $("slugHint").textContent = s ? "Link sẽ là: "+siteBase()+s+"/" : ""; }
$("slug").oninput = hint;
$("rand").onclick = () => { const s=curSlug()||"khach"; $("slug").value = s.replace(/-[a-z0-9]{4}$/,"")+"-"+rnd(4); hint(); };

$("check").onclick = async () => {
  const s=curSlug(), m=$("checkMsg"); m.className=""; m.textContent="";
  if(!s){ m.textContent="Nhập tên thư mục trước."; m.className="err"; return; }
  if(!C.token){ m.textContent="Chưa nhập token ở phần Kết nối GitHub."; m.className="err"; $("settings").open=true; return; }
  m.textContent="Đang kiểm tra...";
  try {
    const d = JSON.parse(await gh(`/contents/${encPath(s+"/data.json")}?ref=${encodeURIComponent(C.branch)}`, {raw:true}));
    existing = d; loadedSlug = s; fillForm(d);
    m.textContent="Đã tải đơn cũ. Sửa chữ tùy ý; ảnh nào không chọn lại sẽ giữ nguyên."; m.className="ok";
  } catch(e) {
    if (e.status===404) { existing=null; loadedSlug=null; exP={}; m.textContent="Chưa có khách nào dùng tên này ✅"; m.className="ok"; }
    else { m.textContent=explain(e); m.className="err"; }
  }
};
function fillForm(d){
  const t=TP(), x = d._f ? {v:d._f, p:d._p||{}} : (t.parse ? t.parse(d) : {v:{},p:{}});
  exP = x.p;
  t.text.forEach(([id]) => { if (x.v[id]!=null) $("v_"+id).value = x.v[id]; });
  t.img.forEach(([k,,,,cap]) => { $("s_"+k).textContent = x.p[k] ? "Đang dùng: "+x.p[k]+" (không chọn file = giữ nguyên)" : ""; if (Array.isArray(cap)) cap.forEach(([id]) => { const e=$("c_"+k+"_"+id), val=x.v["c_"+k+"_"+id]; if (val != null) e.value = val; }); else if (cap) $("c_"+k).value = x.v["c_"+k]||""; });
  if (t.video) $("s_video").textContent = d.video ? "Đang dùng: "+d.video+" (không chọn file = giữ nguyên)" : "";
  const ms=$("musicSel"), li=t.music.lib.findIndex(m=>m.path===d.nhac);
  ms.value = d.nhacLink ? (d.nhacLink.kind==="youtube" ? "yt" : "sp") : li>=0 ? "lib"+li : d.nhac ? "keep" : (t.music.def ? "def" : "none");
  if (d.nhacLink) $("musicUrl").value = d.nhacLink.url;
  if (d.nhac && li<0) { let o=[...ms.options].find(o=>o.value==="keep");
    if(!o){ o=document.createElement("option"); o.value="keep"; ms.insertBefore(o,ms.firstChild); }
    o.textContent="Giữ nhạc hiện tại ("+(d.tenBaiHat||d.nhac)+")"; ms.value="keep"; }
  ms.onchange();
}

/* ================= NÉN ẢNH ================= */
async function compress(file, max){
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(e){ bmp = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Không đọc được ảnh “"+file.name+"”, thử ảnh JPG/PNG.")); i.src=URL.createObjectURL(file); }); }
  const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight, sc=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  let blob = await new Promise(r=>c.toBlob(r,"image/webp",.82)), ext="webp";
  if(!blob || blob.type!=="image/webp"){ blob = await new Promise(r=>c.toBlob(r,"image/jpeg",.85)); ext="jpg"; }
  return {blob, ext};
}

/* ================= TẠO TRANG ================= */
$("f").onsubmit = async ev => {
  ev.preventDefault();
  const btn=$("go"), t=TP(); $("log").textContent=""; $("result").style.display="none";
  try {
    const slug = curSlug();
    if(!slug) throw new Error("Chưa nhập tên thư mục cho khách.");
    if((t.reserved||[]).includes(slug)) throw new Error("Tên “"+slug+"” trùng thư mục của template, hãy chọn tên khác.");
    if(!C.token){ $("settings").open=true; throw new Error("Chưa nhập token GitHub."); }
    btn.disabled=true;
    const dir = slug+"/", files = [];

    if (loadedSlug !== slug) {
      try { await gh(`/contents/${encPath(dir+"data.json")}?ref=${encodeURIComponent(C.branch)}`);
        if(!confirm("Link “"+slug+"” đã có khách dùng. Ghi đè lên trang cũ?")) throw new Error("Đã hủy."); }
      catch(e){ if(e.status!==404) throw e; }
    }

    // chữ
    const v = {}; t.text.forEach(([id]) => v[id] = $("v_"+id).value.trim());
    t.img.forEach(([k,,,,cap]) => { if (Array.isArray(cap)) cap.forEach(([id]) => v["c_"+k+"_"+id] = $("c_"+k+"_"+id).value.trim()); else if (cap) v["c_"+k] = $("c_"+k).value.trim(); });

    // ảnh
    const p = {};
    for (const [k,lb,max,req] of t.img) {
      const f = $("f_"+k).files[0];
      if (f) { log("Nén ảnh: "+lb+"..."); const {blob,ext}=await compress(f,max);
        const name=`${k}-${rnd(4)}.${ext}`; files.push({path:dir+name, blob}); p[k]=name;
        log(`  ${(f.size/1048576).toFixed(1)}MB → ${(blob.size/1024).toFixed(0)}KB`); }
      else if (exP[k]) p[k]=exP[k];
      else if (req) throw new Error("Thiếu: "+lb);
    }

    // video
    let video = existing ? (existing.video||"") : "";
    const vf = t.video && $("video").files[0];
    if (vf) {
      if (vf.size > 60*1048576) throw new Error("Video quá nặng ("+(vf.size/1048576).toFixed(0)+"MB). Hãy nén xuống dưới 25MB.");
      if (vf.size > 25*1048576) log("⚠ Video khá nặng, repo sẽ phình nhanh.");
      const ext=(vf.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"")||"mp4";
      video=`video-${rnd(4)}.${ext}`; files.push({path:dir+video, blob:vf});
    }

    // nhạc: m.nhac rỗng = giữ nhạc mặc định (hoặc không nhạc, tùy template)
    const m = { nhac:"", ten:"", video }; const ms=$("musicSel").value;
    if (ms.startsWith("lib")) { const l=t.music.lib[+ms.slice(3)]; m.nhac=l.path; m.ten=l.name; }
    else if (ms==="keep" && existing) { m.nhac=existing.nhac; m.ten=existing.tenBaiHat||""; }
    else if (ms==="yt" || ms==="sp") { const u=$("musicUrl").value.trim(); if(!/^https?:\/\//.test(u)) throw new Error("Chưa nhập link bài hát (bắt đầu bằng https://)."); m.kind = ms==="yt" ? "youtube" : "spotify"; m.url = u; }
    else if (ms==="up") {
      const mf=$("musicFile").files[0]; if(!mf) throw new Error("Chưa chọn file nhạc.");
      if (mf.size>15*1048576) throw new Error("File nhạc quá nặng (trên 15MB).");
      m.nhac=`music-${rnd(4)}.mp3`; files.push({path:dir+m.nhac, blob:mf});
      m.ten=$("musicName").value.trim()||mf.name.replace(/\.[^.]+$/,"");
    }

    // data.json (relationship đọc trực tiếp; _f/_p để tải lại sửa đơn)
    const data = { video:m.video, nhac:m.nhac, tenBaiHat:m.ten, nhacLink: m.kind ? {kind:m.kind, url:m.url} : undefined, ...(t.build ? t.build(v,p) : {}), _f:v, _p:p };
    files.push({path:dir+"data.json", blob:new Blob([JSON.stringify(data,null,2)],{type:"application/json"})});

    // index.html của khách = bản sao index.html của template (đã thay nội dung), đường dẫn tài nguyên trỏ lên thư mục cha
    log("Lấy khung template “"+repo()+"”...");
    let shell = await gh(`/contents/index.html?ref=${encodeURIComponent(C.branch)}`, {raw:true});
    if (t.render) shell = t.render(shell, v, p, m);
    shell = shell.replace(/(src|href)="(?!https?:|\/\/|#|data:|mailto:|tel:|javascript:|\.\.\/|@@)([^"]+)"/g, '$1="../$2"')
      .replace(/@@/g,"").replace(" data-sample","");
    files.push({path:dir+"index.html", blob:new Blob([shell],{type:"text/html"})});
    if (t.extra) for (const f of await t.extra(v, m)) files.push({path:dir+f.path, blob:new Blob([f.text],{type:"text/plain"})});

    // một commit duy nhất
    log("Đang đưa lên GitHub ("+files.length+" file)...");
    const ref = await gh(`/git/ref/heads/${encodeURIComponent(C.branch)}`);
    const base = (await gh(`/git/commits/${ref.object.sha}`)).tree.sha, tree=[];
    for (const f of files) { const b = await gh("/git/blobs",{method:"POST",body:{content:await b64(f.blob),encoding:"base64"}});
      tree.push({path:f.path, mode:"100644", type:"blob", sha:b.sha}); }
    const tr = await gh("/git/trees",{method:"POST",body:{base_tree:base, tree}});
    const cm = await gh("/git/commits",{method:"POST",body:{message:(loadedSlug===slug?"Sửa trang ":"Tạo trang ")+slug, tree:tr.sha, parents:[ref.object.sha]}});
    await gh(`/git/refs/heads/${encodeURIComponent(C.branch)}`,{method:"PATCH",body:{sha:cm.sha}});
    log("✓ Đã lưu lên GitHub.");

    existing = data; exP = p; loadedSlug = slug;
    showResult(slug);
  } catch(e) { log("✗ "+(e.status?explain(e):e.message)); }
  finally { btn.disabled=false; }
};

/* ================= KẾT QUẢ + CHỜ GITHUB PAGES ================= */
async function showResult(slug){
  const url = siteBase()+slug+"/";
  $("result").style.display="block"; $("resLink").href=url; $("resLink").textContent=url;
  $("qr").innerHTML=""; try{ new QRCode($("qr"),{text:url,width:180,height:180}); }catch(e){}
  $("copy").onclick = async()=>{ try{ await navigator.clipboard.writeText(url); $("copy").textContent="Đã sao chép ✓"; }catch(e){ prompt("Sao chép link:",url); } };
  $("resStatus").textContent="⏳ Đang chờ GitHub cập nhật (thường 1–3 phút). Chưa ghi chip vội nhé..."; $("resStatus").className="";
  $("result").scrollIntoView({behavior:"smooth"});
  for (let i=0;i<60;i++) {
    await new Promise(r=>setTimeout(r,5000));
    try { const r=await fetch(url+"data.json?t="+Date.now(),{cache:"no-store"}); if(r.ok){
      $("resStatus").textContent="✅ Trang đã sẵn sàng! Mở link để kiểm tra rồi ghi vào chip NFC."; $("resStatus").className="ok"; return; } } catch(e){}
  }
  $("resStatus").textContent="Chưa thấy trang lên sau 5 phút. Hãy mở link thử, hoặc xem tab Actions của repo trên GitHub."; $("resStatus").className="err";
}

$("repo").value = repo(); buildForm(); hint();
</script>
